name: 'Material Audacity: Documentation site'

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/material-audacity-pages.yml'
  workflow_dispatch:

concurrency:
  group: material-audacity-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build documentation artifact
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
