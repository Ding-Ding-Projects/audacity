name: 'Material Audacity: Documentation site'

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Material Audacity: Build and release']
    types: [completed]
    branches: [main]

concurrency:
  group: material-audacity-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build documentation artifact
    runs-on: windows-2022
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stage documentation and verified release metadata
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          MA_REQUIRE_MATCHING_RELEASE: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: node docs/site/scripts/stage-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build.site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: windows-2022
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
