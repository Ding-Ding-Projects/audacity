name: Material Audacity Windows delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CI_DIR: buildscripts/ci
  QT_VERSION: '6.10.1'
  QT_MODULES: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'

jobs:
  windows_x64:
    name: Windows x64 build and package
    runs-on: windows-2022
    outputs:
      start_time: ${{ steps.start.outputs.utc }}
      release_tag: ${{ steps.configure.outputs.release_tag }}
    steps:
      - name: Record workflow start time
        id: start
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          STARTED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Windows x64 build and package") | .started_at')
          test -n "$STARTED"
          echo "utc=$STARTED" >> "$GITHUB_OUTPUT"
          echo "First job started: $STARTED"

      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure delivery
        id: configure
        shell: bash
        run: |
          MAJOR=$(sed -n 's/.*MUSE_APP_VERSION_MAJOR "\([0-9]*\)".*/\1/p' version.cmake)
          MINOR=$(sed -n 's/.*MUSE_APP_VERSION_MINOR "\([0-9]*\)".*/\1/p' version.cmake)
          PATCH=$(sed -n 's/.*MUSE_APP_VERSION_PATCH "\([0-9]*\)".*/\1/p' version.cmake)
          TAG="v${MAJOR}.${MINOR}.${PATCH}-m3.${GITHUB_RUN_NUMBER}"
          test -n "$MAJOR" -a -n "$MINOR" -a -n "$PATCH"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to recycle release tag $TAG" >&2
            exit 1
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          cmake -DEVENT=${{ github.event_name }} -DBUILD_MODE=stable_build \
                -DARTIFACT_INFO="Win_x86_64_material" -P ${CI_DIR}/common/ci_configure.cmake

      - name: Install build tools
        shell: bash
        run: |
          choco install -y ccache
          bash ./buildscripts/ci/tools/setup_ccache_config.sh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Setup build environment
        shell: bash
        run: cmake -P ${CI_DIR}/windows/setup.cmake

      - name: Build application
        shell: bash
        run: |
          source /c/build_tools/environment.sh
          cmake -DCRASH_REPORT_URL="''" -P ${CI_DIR}/windows/ci_build.cmake

      - name: Download previous Squirrel release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous-release
          TAG=$(gh release list --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft == false) | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-m3\\.[0-9]+$"))][0] // ""')
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --dir previous-release --pattern RELEASES
            gh release download "$TAG" --dir previous-release --pattern '*.nupkg'
          fi

      - name: Package unsigned Squirrel.Windows installer
        shell: bash
        run: |
          cmake -DPACK_TYPE_OVERRIDE=squirrel -DPACKARCH=x86_64 \
                -DRELEASE_TAG="${{ steps.configure.outputs.release_tag }}" \
                -DRUN_NUMBER="${GITHUB_RUN_NUMBER}" \
                -DPREVIOUS_RELEASES_DIR=previous-release \
                -DSQUIRREL_OUT_DIR=build.artifacts/squirrel \
                -P ${CI_DIR}/windows/package.cmake

      - name: Verify unsigned Squirrel release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'build.artifacts/squirrel'
          . ./buildscripts/ci/windows/squirrel_output.ps1
          $tag = '${{ steps.configure.outputs.release_tag }}'
          $version = [regex]::Replace($tag, '^v?(\d+\.\d+\.\d+)-m3\.(\d+)$', { param($m) '{0}-m3{1:000}' -f $m.Groups[1].Value, [int]$m.Groups[2].Value })
          $null = Assert-SquirrelOutput $dir $version 'Audacity'
          foreach ($path in @((Join-Path $dir 'Setup.exe'), (Join-Path $dir 'RELEASES'))) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required Squirrel asset: $path" }
          }
          $full = @(Get-ChildItem -LiteralPath $dir -Filter '*-full.nupkg' -File)
          if ($full.Count -ne 1) { throw "Expected exactly one Squirrel full package, found $($full.Count)." }
          foreach ($exe in Get-ChildItem -LiteralPath $dir -Filter '*.exe' -File -Recurse) {
            $status = (Get-AuthenticodeSignature -LiteralPath $exe.FullName).Status
            if ($status -ne 'NotSigned') { throw "$($exe.FullName) has signature status $status." }
          }

      - name: Collect safe build outputs
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path delivery-output | Out-Null
          if (Test-Path build.artifacts) { Copy-Item build.artifacts delivery-output\build.artifacts -Recurse -Force }
          $metadata = [ordered]@{ runId='${{ github.run_id }}'; commit='${{ github.sha }}'; jobStatus='${{ job.status }}'; runnerOS='${{ runner.os }}'; runnerArch='${{ runner.arch }}' } | ConvertTo-Json
          Set-Content -LiteralPath delivery-output\metadata.json -Value $metadata -Encoding utf8

      - name: Upload safe build outputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: material-audacity-windows-x64-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: delivery-output/**

  release:
    name: Publish Windows release
    needs: windows_x64
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows delivery outputs
        uses: actions/download-artifact@v6
        with:
          name: material-audacity-windows-x64-${{ github.run_id }}
          path: downloaded-output

      - name: Bootstrap required release tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('python', 'gh')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              choco install -y $tool
            }
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required release tool is unavailable after bootstrap: $tool"
            }
          }
          python --version
          gh --version

      - name: Collect exact Squirrel release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets,release-metadata | Out-Null
          . ./buildscripts/ci/windows/squirrel_output.ps1
          $tag = '${{ needs.windows_x64.outputs.release_tag }}'
          $version = [regex]::Replace($tag, '^v?(\d+\.\d+\.\d+)-m3\.(\d+)$', { param($m) '{0}-m3{1:000}' -f $m.Groups[1].Value, [int]$m.Groups[2].Value })
          # Read only the exact package directory, never recursive filename matches
          # that might also collect a retained previous transaction generation.
          Copy-SquirrelReleaseAssets -Source 'downloaded-output/build.artifacts/squirrel' `
            -Destination 'release-assets' -Version $version -PackageId 'Audacity'

      - name: Resolve dim sum photo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python buildscripts/ci/tools/dim_sum_release.py --repo "$env:GITHUB_REPOSITORY" `
            --assets-dir release-assets --output-json release-metadata/dim-sum.json

      - name: Generate deterministic release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python buildscripts/ci/tools/count_lines.py --root . | Set-Content -LiteralPath release-metadata/line-counts.md -Encoding utf8
          if (-not (Get-Content -Raw release-metadata/line-counts.md).Trim()) { throw 'Line count report is empty.' }
          $checksumInputs = @(Get-ChildItem release-assets -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object Name)
          if ($checksumInputs.Count -eq 0) { throw 'No release assets available for checksums.' }
          $checksumLines = foreach ($asset in $checksumInputs) {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLower(), $asset.Name
          }
          $checksumTemp = 'release-assets/SHA256SUMS.tmp'
          $checksumLines | Set-Content -LiteralPath $checksumTemp -Encoding ascii
          Move-Item -LiteralPath $checksumTemp -Destination 'release-assets/SHA256SUMS' -Force
          $tag = '${{ needs.windows_x64.outputs.release_tag }}'
          $packageVersion = [regex]::Replace($tag, '^v?(\d+\.\d+\.\d+)-m3\.(\d+)$', { param($m) '{0}-m3{1:000}' -f $m.Groups[1].Value, [int]$m.Groups[2].Value })
          python buildscripts/ci/tools/release_notes.py `
            --tag $tag --version $packageVersion `
            --start-time '${{ needs.windows_x64.outputs.start_time }}' `
            --end-time (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') `
            --completion-boundary 'Release upload has not started; this draft is replaced after asset upload completes.' `
            --repo "$env:GITHUB_REPOSITORY" --run-id "$env:GITHUB_RUN_ID" `
            --commit '${{ github.sha }}' --assets-dir release-assets `
            --line-count-file release-metadata/line-counts.md `
            --dim-sum-json release-metadata/dim-sum.json --output release-metadata/RELEASE_NOTES.md

      - name: Publish unique non-draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ needs.windows_x64.outputs.release_tag }}'
          if (gh release view $tag 2>$null) { throw "Refusing to overwrite existing release $tag" }
          $uploadAssets = @(Get-ChildItem release-assets -File | Where-Object { $_.Name -notlike 'RELEASE_NOTES*' } | Sort-Object Name | ForEach-Object FullName)
          gh release create $tag $uploadAssets --target '${{ github.sha }}' `
            --title "Material Audacity $tag" --notes-file release-metadata/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed with exit code $LASTEXITCODE" }
          $completed = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $packageVersion = [regex]::Replace($tag, '^v?(\d+\.\d+\.\d+)-m3\.(\d+)$', { param($m) '{0}-m3{1:000}' -f $m.Groups[1].Value, [int]$m.Groups[2].Value })
          python buildscripts/ci/tools/release_notes.py `
            --tag $tag --version $packageVersion `
            --start-time '${{ needs.windows_x64.outputs.start_time }}' --end-time $completed `
            --completion-boundary 'Release asset upload completed; this timestamp is recorded after gh release create returned success.' `
            --repo "$env:GITHUB_REPOSITORY" --run-id "$env:GITHUB_RUN_ID" `
            --commit '${{ github.sha }}' --assets-dir release-assets `
            --line-count-file release-metadata/line-counts.md `
            --dim-sum-json release-metadata/dim-sum.json --output release-metadata/RELEASE_NOTES_FINAL.md
          gh release edit $tag --notes-file release-metadata/RELEASE_NOTES_FINAL.md
