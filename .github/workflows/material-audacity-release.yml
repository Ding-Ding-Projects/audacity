name: 'Material Audacity: Build and release'

on:
  push:
    branches:
      - master
    tags:
      - 'v4.0.0-m3.*'
  workflow_dispatch:

concurrency:
  group: material-audacity-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_DIR: buildscripts/ci
  QT_VERSION: '6.10.1'
  QT_MODULES: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'

jobs:
  windows_x64:
    name: Windows x64
    runs-on: windows-2022
    outputs:
      start_time: ${{ steps.start.outputs.utc }}
      build_version: ${{ steps.configure.outputs.build_version }}
    steps:
      # This is the very first step of the very first job. Its output is the
      # authoritative workflow start time used in the release notes.
      - name: Record workflow start time
        id: start
        shell: bash
        run: |
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Workflow started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure workflow
        id: configure
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_MODE=stable_build
          else
            BUILD_MODE=devel_build
          fi

          cmake -DEVENT=${{ github.event_name }} \
                -DBUILD_MODE=${BUILD_MODE} \
                -DARTIFACT_INFO="Win_x86_64_material" \
                -P ${CI_DIR}/common/ci_configure.cmake

          echo "BUILD_MODE=${BUILD_MODE}" >> "$GITHUB_ENV"
          echo "build_version=$(cat ./build.artifacts/env/build_version.env)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache files
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-material-ccache-
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-material-ccache-

      - name: Setup ccache
        shell: bash
        run: |
          choco install -y ccache
          bash ./buildscripts/ci/tools/setup_ccache_config.sh

      - name: Register msvc problem matcher
        run: echo "::add-matcher::.github/problem_matchers/msvc.json"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Setup environment
        shell: bash
        run: |
          cmake -P ${CI_DIR}/windows/setup.cmake

      - name: Build
        shell: bash
        run: |
          source /c/build_tools/environment.sh
          cmake -DCRASH_REPORT_URL="''" -P ${CI_DIR}/windows/ci_build.cmake

      - name: Show ccache stats
        shell: bash
        run: ccache -sv

      - name: Download the previous release for delta packages
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-release
          TAG=$(gh release list --limit 20 --json tagName,isDraft \
                --jq '[.[] | select(.isDraft == false) | .tagName] | map(select(startswith("v4.0.0-m3."))) | .[0] // ""')
          if [ -z "$TAG" ]; then
            echo "No previous Material Audacity release found. Only a full package will be produced."
            exit 0
          fi
          echo "Previous release: $TAG"
          gh release download "$TAG" --dir previous-release --pattern 'RELEASES' || true
          gh release download "$TAG" --dir previous-release --pattern '*.nupkg' || true
          ls -la previous-release || true

      - name: Package with Squirrel.Windows
        shell: bash
        run: |
          cmake -DPACK_TYPE_OVERRIDE=squirrel \
                -DPACKARCH=x86_64 \
                -DRELEASE_TAG="${GITHUB_REF_NAME}" \
                -DRUN_NUMBER="${GITHUB_RUN_NUMBER}" \
                -DPREVIOUS_RELEASES_DIR="previous-release" \
                -DSQUIRREL_OUT_DIR="build.artifacts/squirrel" \
                -P ${CI_DIR}/windows/package.cmake

      - name: Verify that nothing is code signed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "build.artifacts/squirrel"
          $files = @(Get-ChildItem -Path $dir -Filter *.exe -File -Recurse)
          if ($files.Count -eq 0) {
            throw "No executables were produced in $dir"
          }
          $failed = $false
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature -LiteralPath $file.FullName).Status
            Write-Host ("{0}: {1}" -f $file.Name, $status)
            if ($status -ne "NotSigned") { $failed = $true }
          }
          if ($failed) {
            throw "Code signing is permanently prohibited, but a signed executable was produced."
          }
          Write-Host "All produced executables report NotSigned, as required."

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: material-audacity-windows-x64
          if-no-files-found: warn
          path: |
            build.artifacts/squirrel/**

  linux_x64:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure workflow
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_MODE=stable_build
          else
            BUILD_MODE=devel_build
          fi

          cmake -DEVENT=${{ github.event_name }} \
                -DBUILD_MODE=${BUILD_MODE} \
                -DARTIFACT_INFO="Lin_x86_64_material" \
                -P ${CI_DIR}/common/ci_configure.cmake

          echo "BUILD_MODE=${BUILD_MODE}" >> "$GITHUB_ENV"

      - name: Restore ccache files
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-material-ccache-
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-material-ccache-

      - name: Setup ccache
        run: |
          sudo apt-get update && sudo apt-get install -y ccache
          bash ./buildscripts/ci/tools/setup_ccache_config.sh

      - name: Register gcc problem matcher
        run: echo "::add-matcher::.github/problem_matchers/gcc.json"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Setup environment
        run: bash ${CI_DIR}/linux/setup.sh

      - name: Build
        run: |
          source "$HOME/build_tools/environment.sh"
          cmake -DCRASH_REPORT_URL="''" -P ${CI_DIR}/linux/ci_build.cmake

      - name: Show ccache stats
        run: ccache -sv

      - name: Package AppImage
        run: cmake -DPACKARCH=x86_64 -P ${CI_DIR}/linux/package.cmake

      - name: Upload Linux artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: material-audacity-linux-x64
          if-no-files-found: warn
          path: |
            build.artifacts/*.AppImage

  release:
    name: Publish release
    needs:
      - windows_x64
      - linux_x64
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: downloaded-artifacts

      - name: Collect release assets
        id: collect
        shell: bash
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f \
               \( -name 'Setup.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name '*.AppImage' \) \
               -exec cp -f {} release-assets/ \;
          ls -la release-assets
          if [ -z "$(ls -A release-assets)" ]; then
            echo "No release assets were collected" >&2
            exit 1
          fi

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        shell: bash
        run: |
          # v4.0.0-m3.7 becomes the SemVer 1 package version 4.0.0-m3007.
          PKG_VERSION=$(python3 -c "import re,sys; t=sys.argv[1]; m=re.match(r'^v?(\d+\.\d+\.\d+)-m3\.(\d+)$', t); print('{0}-m3{1:03d}'.format(m.group(1), int(m.group(2))) if m else t.lstrip('v'))" "${GITHUB_REF_NAME}")
          echo "Package version: ${PKG_VERSION}"
          python3 buildscripts/ci/tools/release_notes.py \
            --tag "${GITHUB_REF_NAME}" \
            --version "${PKG_VERSION}" \
            --start-time "${{ needs.windows_x64.outputs.start_time }}" \
            --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --commit "${GITHUB_SHA}" \
            --assets-dir release-assets \
            --output RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Material Audacity ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
